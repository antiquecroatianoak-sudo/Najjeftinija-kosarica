# Svaki dan preuzme svježe cijene i objavi aplikaciju na GitHub Pages.
name: Dnevno ažuriranje cijena

on:
  schedule:
    - cron: "17 7 * * *"   # 8:17 zimi / 9:17 ljeti po hrvatskom vremenu, poslije roka objave cjenika (8:00)
  push:                     # i odmah nakon svake promjene aplikacije
  workflow_dispatch:        # gumb "Run workflow" za ručno pokretanje

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Radna grana ne prekida objavu glavne grane (ni obrnuto).
  group: ${{ github.ref_name == github.event.repository.default_branch && 'pages' || format('provjera-{0}', github.ref_name) }}
  cancel-in-progress: true

jobs:
  azuriraj-i-objavi:
    # Objavljuje se samo glavna grana repozitorija.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Provjeri uvoz cijena i količina
        run: |
          python tests/kolicine.py
          python tests/cijene_lanca.py
          python tests/sluzbeni.py
          python tests/lokacije.py

      - name: Preuzmi cijene svih trgovačkih lanaca
        run: |
          pip install --quiet openpyxl==3.1.5
          python scripts/azuriraj_cijene.py

      - name: Koordinate poslovnica i naselja (OpenStreetMap)
        run: python scripts/lokacije_poslovnica.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Provjeri zajednička pravila skupina
        run: |
          node tests/skupine.cjs
          node tests/kosarica.cjs
          node tests/glasovni-unos.cjs
          node tests/sve-u-jednom.cjs
          node tests/sluzbene-ponude.cjs
          node tests/sw.cjs
          node tests/krug.cjs
          node tests/krug-specifikacija.cjs

      - name: Pripremi skupine za novi cjenik
        run: node scripts/razvrstaj.cjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Objavi aplikaciju
        id: objava
        uses: actions/deploy-pages@v4

  # Samo na radnim granama: brza provjera koordinata poslovnica (OpenStreetMap) na objavljenom cjeniku, bez objave.
  koordinate:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test uparivanja
        run: python tests/lokacije.py
      - name: Koordinate poslovnica na objavljenom cjeniku (OpenStreetMap), uzorci neuparenih
        run: |
          curl -fsS -o /tmp/objavljeno.json https://antiquecroatianoak-sudo.github.io/Najjeftinija-kosarica/data/proizvodi.json
          python -u scripts/lokacije_poslovnica.py /tmp/objavljeno.json
          python - <<'EOF'
          import json, collections
          iz = json.load(open("site/data/lokacije-izvjesce.json"))
          print("Kvaliteta:", iz["kvaliteta"], "status:", iz["status"], "OSM datum:", iz["osm_datum"], "višeznačno:", iz["viseznacno"])
          po = collections.defaultdict(list)
          for t in iz["parovi"]:
              po[t["lanac"]].append(t)
          for lanac, tt in po.items():
              bez = [t for t in tt if "lat" not in t]
              sa = [t for t in tt if "lat" in t]
              print(f"== {lanac}: {len(sa)}/{len(tt)}")
              for t in sa[:3]:
                  print("   +", t["adresa"][:90], "->", t["osm_adresa"][:70], t["osm"], t["kvaliteta"])
              for t in bez[:6]:
                  print("   -", t["adresa"][:110], "|", t["razlog"][:50])
          EOF
          python - <<'EOF'
          import json, sys
          sys.path.insert(0, "scripts")
          import lokacije_poslovnica as lp
          el = lp.overpass(lp.upit_trgovina())["elements"]
          import collections
          c = collections.Counter(); s_adresom = collections.Counter()
          for e in el:
              o = e.get("tags", {})
              for l in lp.lanac_elementa(o):
                  c[l] += 1
                  if o.get("addr:street") and o.get("addr:housenumber"):
                      s_adresom[l] += 1
          print("OSM trgovine po lancu (ukupno / s ulicom i brojem):", {l: f"{c[l]}/{s_adresom[l]}" for l in c})
          EOF

      - name: Veličina cjenika poslovnica unutar 20 km od Zagreba i Splita (objavljeni podaci)
        run: |
          python - <<'EOF'
          import json, sys, hashlib, urllib.request, collections
          sys.path.insert(0, "scripts")
          import lokacije_poslovnica as lp
          pod = json.load(open("/tmp/objavljeno.json"))
          lok = json.load(open("site/data/lokacije.json"))["poslovnice"]
          indeks = {(pod["lanci"][p[0]], p[1]): i for i, p in enumerate(pod["poslovnice"])}
          for ime, lat, lon in (("Zagreb", 45.8131, 15.9775), ("Split", 43.5081, 16.4402)):
              blizu = [(indeks[(l[0], l[1])], l[0]) for l in lok if (l[0], l[1]) in indeks and lp.udaljenost_km(lat, lon, l[2], l[3]) <= 20]
              vel, cvel, jedinstveni, po_lancu = 0, 0, set(), collections.Counter()
              for idx, lanac in blizu:
                  try:
                      b = urllib.request.urlopen(f"https://antiquecroatianoak-sudo.github.io/Najjeftinija-kosarica/data/poslovnice/{idx}.json", timeout=60).read()
                  except Exception as e:
                      print("  greška", idx, e); continue
                  d = json.loads(b); vel += len(b)
                  c = json.dumps(d["c"]).encode(); cvel += len(c)
                  jedinstveni.add(hashlib.sha1(c).hexdigest()); po_lancu[lanac] += 1
              print(f"{ime} 20 km: {len(blizu)} poslovnica s koordinatama, {vel // 1000} kB datoteka (samo cijene {cvel // 1000} kB), "
                    f"jedinstvenih cjenika {len(jedinstveni)}; po lancu {dict(po_lancu)}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lokacije
          path: |
            site/data/lokacije.json
            site/data/lokacije-izvjesce.json
            site/data/mjesta.json
          if-no-files-found: ignore

  # Samo na radnim granama: dijagnoza cijena jednog proizvoda na stvarnom cjeniku, bez objave.
  dijagnoza:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testovi uvoza
        run: |
          python tests/kolicine.py
          python tests/cijene_lanca.py
          python tests/sluzbeni.py
          python tests/lokacije.py
      - name: Dijagnoza cijena (krumpir)
        run: python -u scripts/dijagnoza_proizvoda.py krumpir
      - name: Puni uvoz kao na glavnoj grani (bez objave), pokrivenost i veličina datoteka poslovnica
        run: |
          pip install --quiet openpyxl==3.1.5
          # Lanci objavljuju do 8:00; provjera na radnoj grani prije 8:00 koristi jučerašnje (potpune) cjenike.
          if [ "$(TZ=Europe/Zagreb date +%H)" -lt 8 ]; then D=$(TZ=Europe/Zagreb date -d yesterday +%F); else D=$(TZ=Europe/Zagreb date +%F); fi
          echo "SLUZBENI_DATUM=$D" >> "$GITHUB_ENV"
          SLUZBENI_DATUM=$D python -u scripts/azuriraj_cijene.py
          python - <<'EOF'
          import json
          from pathlib import Path
          d = Path("site/data")
          pok = json.loads((d / "pokrivenost.json").read_text())
          print(f"Provjereno prema službenom izvoru: {pok['provjereno_prema_sluzbenom_izvoru']} od {pok['ukupno_ponuda']} ponuda")
          print("Pokrivenost po lancu (provjereno prema službenom izvoru / ponuda):")
          for ime, x in pok["lanci"].items():
              print(f"  {ime}: {x['provjereno_prema_sluzbenom_izvoru']}/{x['ponuda']} · {x['izvor']} · poslovnica {x['poslovnica']} · "
                    f"proturječnih redaka {x['redak_proturjecan_jedinicnoj']} · nepotvrđena količina {x['kolicina_nepotvrdena']}"
                    + (f" · razlog: {x['razlog']}" if x.get("razlog") else "")
                    + (f" · neuspjelih datoteka {x['neuspjelih_datoteka']} ({x.get('primjer_greske', '')[:120]})" if x.get("neuspjelih_datoteka") else "")
                    + (f" · nepoznati stupci {x['nepoznati_stupci']}" if x.get("nepoznati_stupci") else ""))
          for ime, x in pok["bez_podataka"].items():
              print(f"  BEZ PODATAKA {ime}: {x.get('razlog')}")
          # Provjera prijavljenog krumpira u službenom zapisu: lanac, cijena, poslovnica, datoteka i redak.
          pod = json.loads((d / "proizvodi.json").read_text())
          for i, p in enumerate(pod["proizvodi"]):
              if "KRUMPIR ZA GASTRO" in p[0].upper():
                  for k in range(0, len(p[5]), 2):
                      pon = p[6][k // 2]
                      st = pod["poslovnice"][pon[0]]
                      izv = pod["izvori"][st[4]] if st[4] >= 0 else None
                      print("KRUMPIR (službeni zapis): " + json.dumps({"naziv": p[0], "lanac": pod["lanci"][p[5][k]], "cijena": p[5][k + 1],
                            "poslovnica": st[1], "datoteka": izv, "redak": pon[4] if len(pon) > 4 else None,
                            "najviša u lancu": pon[2], "poslovnica s cijenom": pon[1]}, ensure_ascii=False))
                  for s_idx, st in enumerate(pod["poslovnice"]):
                      if pod["lanci"][st[0]] == "Trgovina Krk":
                          f = json.loads((d / "poslovnice" / f"{s_idx}.json").read_text())
                          j, ind = 0, {}
                          for k in range(0, len(f["c"]), 2):
                              j += f["c"][k]
                              ind[j] = (f["c"][k + 1], f.get("r", [None] * len(f["c"]))[k // 2])
                          if i in ind:
                              print(f"  Krk poslovnica {st[1]}: {ind[i][0] / 100:.2f} €, redak {ind[i][1]}, {f.get('izvor')}")
          datoteke = sorted((d / "poslovnice").glob("*.json"), key=lambda f: f.stat().st_size)
          print(f"Datoteka poslovnica: {len(datoteke)}, ukupno {sum(f.stat().st_size for f in datoteke) // 1000} kB, "
                f"najveća {datoteke[-1].stat().st_size // 1000} kB, medijan {datoteke[len(datoteke) // 2].stat().st_size // 1000} kB; "
                f"proizvodi.json {(d / 'proizvodi.json').stat().st_size // 1000} kB")
          EOF
      - name: Revizija marki i koordinata na uvezenom cjeniku
        run: |
          python -u scripts/lokacije_poslovnica.py
          python - <<'EOF'
          import json, collections
          from pathlib import Path
          d = Path("site/data")
          pod = json.loads((d / "proizvodi.json").read_text())
          print(f"Izdanje cjenika: {pod.get('izdanje')} ({pod['datum']}); različitih marki: {len(pod.get('marke', []))}")
          s_markom = sum(1 for p in pod["proizvodi"] if len(p) > 7 and p[7] >= 0)
          print(f"Proizvoda sa stvarnom markom iz cjenika: {s_markom} od {len(pod['proizvodi'])} ({100 * s_markom / len(pod['proizvodi']):.1f} %)")
          po_lancu, uk = collections.Counter(), collections.Counter()
          for p in pod["proizvodi"]:
              for k in range(0, len(p[5]), 2):
                  uk[pod["lanci"][p[5][k]]] += 1
                  if p[7] >= 0:
                      po_lancu[pod["lanci"][p[5][k]]] += 1
          print("Ponude s poznatom markom po lancu: " + ", ".join(f"{l} {po_lancu[l]}/{uk[l]}" for l in sorted(uk)))
          f = next((d / "poslovnice").glob("*.json"))
          z = json.loads(f.read_text())
          print(f"Datoteka poslovnice {f.name}: izdanje {z.get('izdanje')} == {pod.get('izdanje')}: {z.get('izdanje') == pod.get('izdanje')}, poslovnica {z.get('poslovnica')}")
          EOF

      - name: Službeni zapis prijavljenog krumpira (Trgovina Krk, sirovi retci s datotekom i retkom)
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sys.path.insert(0, "scripts")
          import sluzbeni_cjenici as sl
          import os
          d = datetime.fromisoformat(os.environ["SLUZBENI_DATUM"]).date() if os.environ.get("SLUZBENI_DATUM") else datetime.now(ZoneInfo("Europe/Zagreb")).date()
          rez = sl.preuzmi_lanac("trgovina-krk", d)
          print(f"Krk {d}: {len(rez.get('koristene', []))} datoteka; {rez.get('razlog', '')}")
          for dat in rez.get("koristene", []):
              for z in dat["zapisi"]:
                  if "GASTRO" in z["naziv"].upper() and "KRUMPIR" in z["naziv"].upper():  # i nedostupni retci
                      print(json.dumps({"datoteka": sl.siguran_url(dat["url"]), "redak": z["_redak"], **{k: v for k, v in z.items() if k != "_redak"}}, ensure_ascii=False))
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Skupine i testovi aplikacije na uvezenom cjeniku
        run: |
          node scripts/razvrstaj.cjs
          node tests/skupine.cjs
          node tests/kosarica.cjs
          node tests/sve-u-jednom.cjs
          node tests/sluzbene-ponude.cjs
          node tests/sw.cjs
          node tests/krug.cjs
          node tests/krug-specifikacija.cjs
      - name: Revizija cijena svih lanaca (prije/poslije)
        run: python -u scripts/revizija_cijena.py krumpir
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dijagnoza
          path: |
            site/data/dijagnoza.json
            site/data/revizija-cijena.json
            site/data/pokrivenost.json
          if-no-files-found: ignore

