# PRIVREMENO: kopira objavljene podatke na granu dijagnoza-podaci radi provjere razvrstavanja. Ukloniti nakon nalaza.
name: Dijagnoza izvora
on:
  push:
    branches: [claude/claude-code-app-issue-bhn89z]
    paths: [.github/workflows/dijagnoza.yml]
permissions:
  contents: write
jobs:
  dijagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          mkdir d && cd d
          B=https://antiquecroatianoak-sudo.github.io/Najjeftinija-kosarica/data/hr
          curl -fsS -o proizvodi.json "$B/proizvodi.json?x=$RANDOM"
          curl -fsS -o grupe.json "$B/grupe.json?x=$RANDOM"
          curl -fsS -o meta.json "$B/meta.json?x=$RANDOM"
          gzip -9 proizvodi.json && ls -la
          git init -q -b dijagnoza-podaci && git add . 
          git -c user.name=dijagnoza -c user.email=dijagnoza@users.noreply.github.com commit -qm "Privremeni podaci za dijagnozu"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dijagnoza-podaci
