# PRIVREMENO: kopira cijele objavljene podatke (uključujući datoteke poslovnica) na granu dijagnoza-podaci
# radi provjere aplikacije sa stvarnim podacima. Ništa ne objavljuje. Ukloniti nakon provjere.
name: Dijagnoza izvora
on:
  push:
    branches: [claude/claude-code-app-issue-bhn89z]
    paths: [.github/workflows/dijagnoza.yml]
permissions:
  contents: write
jobs:
  dijagnoza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          mkdir -p d/s && cd d
          B=https://antiquecroatianoak-sudo.github.io/Najjeftinija-kosarica/data/hr
          for f in meta proizvodi poslovnice grupe lokacije; do curl -fsS -o $f.json "$B/$f.json?x=$RANDOM"; done
          python3 -c "import json;print('\n'.join(sorted({p[7] for p in json.load(open('poslovnice.json'))['p']})))" > popis.txt
          wc -l popis.txt
          xargs -P 8 -I{} curl -fsS -o s/{}.json "$B/s/{}.json" < popis.txt
          ls s | wc -l; du -sh .
          git init -q -b dijagnoza-podaci && git add .
          git -c user.name=dijagnoza -c user.email=dijagnoza@users.noreply.github.com commit -qm "Privremeni podaci za provjeru"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dijagnoza-podaci
