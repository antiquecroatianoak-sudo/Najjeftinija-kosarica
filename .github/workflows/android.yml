name: Android aplikacija

on:
  push:
    paths:
      - "android/**"
      - "scripts/app_katalog.cjs"
      - "site/skupine.js"
      - "tests/app-katalog.cjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write   # probna objava APK-a (release "proba") i kataloga cijena (release "podaci")

concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test graditelja kataloga
        run: |
          node tests/app-katalog.cjs
          node tests/skupine.cjs

      # Katalog za aplikaciju iz objavljenog dnevnog cjenika (GitHub Pages) – isti izvor kao web-aplikacija.
      - name: Katalog cijena za aplikaciju
        run: |
          curl -fsS --retry 4 --retry-delay 10 -o "$RUNNER_TEMP/proizvodi.json" \
            https://antiquecroatianoak-sudo.github.io/Najjeftinija-kosarica/data/proizvodi.json
          node scripts/app_katalog.cjs "$RUNNER_TEMP/proizvodi.json" "$RUNNER_TEMP/katalog.json" | tee "$RUNNER_TEMP/katalog-stat.json"
          mkdir -p android/app/src/main/assets
          cp "$RUNNER_TEMP/katalog.json.gz" android/app/src/main/assets/katalog.gzdat
          {
            echo "### Katalog cijena"
            echo '```'; cat "$RUNNER_TEMP/katalog-stat.json"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Trajni ključ iz tajni repozitorija ako postoji; inače privremeni ključ samo za probnu instalaciju.
      - name: Ključ za potpis
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          K_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/kljuc.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            VRSTA="trajni ključ iz tajni"
          else
            KS_PASS="$(openssl rand -hex 16)"; K_PASS="$KS_PASS"; K_ALIAS="privremeni"
            echo "::add-mask::$KS_PASS"
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$K_PASS" -alias "$K_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Najjeftinija kosarica proba" -noprompt
            VRSTA="PRIVREMENI ključ (samo za probu na mobitelu, nije za Google Play)"
          fi
          {
            echo "KEYSTORE_PATH=$KS"; echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=$K_ALIAS"; echo "KEY_PASSWORD=$K_PASS"
          } >> "$GITHUB_ENV"
          echo "### Potpis: $VRSTA" >> "$GITHUB_STEP_SUMMARY"

      - name: Testovi jezgre i izgradnja APK/AAB
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android --no-daemon :jezgra:test :app:assembleRelease :app:bundleRelease

      # Ugrađeni katalog mora biti u APK-u pod imenom koje aplikacija čita (inače nema cijena bez interneta).
      - name: Provjera APK-a
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q "assets/katalog.gzdat"
          unzip -p android/app/build/outputs/apk/release/app-release.apk assets/katalog.gzdat | gzip -t
          echo "Ugrađeni katalog je u APK-u i ispravan gzip."

      - uses: actions/upload-artifact@v4
        with:
          name: kosarica-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testovi-jezgre-${{ github.run_number }}
          path: android/jezgra/build/reports/tests/
          if-no-files-found: ignore

      # Stalne poveznice (bez prijave i bez zipa):
      #   APK:     .../releases/download/proba/najjeftinija-kosarica.apk
      #   katalog: .../releases/download/podaci/katalog.json.gz  (aplikacija ga sama preuzima)
      - name: Probna objava APK-a i kataloga
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk najjeftinija-kosarica.apk
          gh release delete proba --yes --cleanup-tag 2>/dev/null || true
          gh release create proba najjeftinija-kosarica.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Probna Android verzija (izgradnja ${{ github.run_number }})" \
            --notes "Izvorna Android aplikacija, prva verzija s nekoliko velikih lanaca. Samo za probu, nije s Google Playa. Prije instalacije nove verzije deinstaliraj staru (privremeni potpis). Upute: docs/android-instalacija.md"
          gh release view podaci >/dev/null 2>&1 || gh release create podaci --prerelease --target "$GITHUB_SHA" \
            --title "Katalog cijena za aplikaciju" --notes "Dnevni katalog cijena koji aplikacija preuzima. Izveden iz javnih službenih cjenika."
          gh release upload podaci "$RUNNER_TEMP/katalog.json.gz" --clobber
          {
            echo "### Preuzimanje na mobitelu"
            echo "${{ github.server_url }}/${{ github.repository }}/releases/download/proba/najjeftinija-kosarica.apk"
          } >> "$GITHUB_STEP_SUMMARY"

  # Proba na emulatoru: instalacija, pokretanje, upis popisa, snimke zaslona i provjera rušenja.
  proba-na-emulatoru:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kosarica-android-${{ github.run_number }}
          path: apk

      - name: KVM za emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pokreni aplikaciju na emulatoru
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/proba-emulator.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snimke-emulatora-${{ github.run_number }}
          path: snimke/
          if-no-files-found: ignore

      - name: Objavi snimke uz probnu verziju
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls snimke/*.png >/dev/null 2>&1 && gh release upload proba snimke/*.png --clobber -R "${{ github.repository }}" || true
