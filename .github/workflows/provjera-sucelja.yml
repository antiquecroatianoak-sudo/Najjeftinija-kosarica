name: Provjera sucelja
on:
  push:
    branches:
      - codex/redizajn-sucelja-2026-10-19
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provjeri:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: |
          mkdir -p test-results
          python3 -m http.server 8765 --directory site > /tmp/server.log 2>&1 &
          node scripts/provjeri-sucelje.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prikaz-sucelja
          path: test-results/
