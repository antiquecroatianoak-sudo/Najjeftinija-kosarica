<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Energija</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<div id="uparivanje" class="uparivanje" hidden>
  <form id="obrazac-uparivanja" class="kartica-uparivanja">
    <h1>Upari uređaj</h1>
    <p class="blago">Upišite kod s jezgre (zaslon ili naljepnica) ili kod koji vam je dao administrator.</p>
    <input id="kod" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{6,8}" placeholder="kod" required aria-label="Kod za uparivanje">
    <button type="submit">Upari</button>
    <p id="greska-uparivanja" class="greska" role="alert"></p>
  </form>
</div>

<div id="aplikacija" hidden>
  <header class="zaglavlje">
    <div class="marka">
      <span class="logo" aria-hidden="true"></span>
      <div><div class="naziv" id="naziv">Energija</div><div class="blago" id="podnaslov">–</div></div>
    </div>
    <div class="kontrole">
      <div class="segment" role="radiogroup" aria-label="Prikaz" id="izbor-prikaza">
        <button type="button" role="radio" data-prikaz="stanar">Dom</button>
        <button type="button" role="radio" data-prikaz="admin">Kontrolni centar</button>
      </div>
      <button type="button" class="ikona-gumb" id="tema" aria-label="Tema: prema sustavu" title="Tema">◐</button>
    </div>
  </header>

  <div id="filteri" class="filteri" hidden>
    <div class="segment" role="radiogroup" aria-label="Razdoblje" id="izbor-raspona">
      <button type="button" role="radio" data-raspon="6h">6 h</button>
      <button type="button" role="radio" data-raspon="24h">24 h</button>
      <button type="button" role="radio" data-raspon="48h">48 h</button>
      <button type="button" role="radio" data-raspon="7d">7 dana</button>
      <button type="button" role="radio" data-raspon="30d">30 dana</button>
    </div>
    <span class="blago" id="uzivo-oznaka"><span class="puls" aria-hidden="true"></span> uživo</span>
  </div>

  <main id="sadrzaj"></main>
  <footer class="podnozje blago">Radi lokalno · bez interneta nastavlja autonomno · <a href="/api/v1/openapi.json">API v1</a> · <a href="primjer-ugradnje.html">primjer ugradnje</a></footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
