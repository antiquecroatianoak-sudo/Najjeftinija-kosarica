plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "hr.najjeftinijakosarica.app"
    compileSdk 36

    defaultConfig {
        // ID aplikacije: nakon prvog uploada na Google Play više se ne može mijenjati.
        applicationId "hr.najjeftinijakosarica.app"
        minSdk 26
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "0.2.0"
        // Dnevni katalog cijena (isti koji je ugrađen u aplikaciju kao početni).
        buildConfigField "String", "KATALOG_URL",
            "\"https://github.com/antiquecroatianoak-sudo/Najjeftinija-kosarica/releases/download/podaci/katalog.json.gz\""
        buildConfigField "String", "PREUZIMANJE_URL",
            "\"https://github.com/antiquecroatianoak-sudo/Najjeftinija-kosarica/releases/download/proba/najjeftinija-kosarica.apk\""
    }

    signingConfigs {
        release {
            // Ključ dolazi iz CI-a (tajne ili privremeni ključ); nikad se ne sprema u repozitorij.
            storeFile System.getenv("KEYSTORE_PATH") ? file(System.getenv("KEYSTORE_PATH")) : null
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : null
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}

dependencies {
    implementation project(":jezgra")
    implementation platform("androidx.compose:compose-bom:2025.05.00")
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
